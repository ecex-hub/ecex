version: '3.8'

services:
  # PHP + Nginx 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yii2-app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend/runtime:/var/www/html/backend/runtime
      - ./backend/web/assets:/var/www/html/backend/web/assets
      - ./logs:/var/log
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ecex}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - mysql
      - redis
    networks:
      - backend-network

  # MySQL 5.7
  mysql:
    image: mysql:5.7
    container_name: yii2-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-ecex}
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=1000
      - --innodb_buffer_pool_size=512M
    networks:
      - backend-network

  # Redis
  redis:
    image: redis:6-alpine
    container_name: yii2-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - backend-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  backend-network:
    driver: bridge

