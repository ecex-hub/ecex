version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecex-backend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-stock}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
    volumes:
      - ./backend/runtime:/var/www/html/backend/runtime
      - ./backend/web/assets:/var/www/html/backend/web/assets
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ecex-network
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: ecex-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-stock}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ecex-network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: ecex-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - ecex-network

networks:
  ecex-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  caddy_data:
  caddy_config:

