<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">直播链接地址:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" class="form-control"
                   name="row[content]" type="text" value="{$row.content|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">官方群组配置链接:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-group" class="form-control"
                   name="row[group]" type="text" value="{$group.content|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">聊天软件配置链接:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-group1" class="form-control"
                   name="row[group1]" type="text" value="{$group1.content|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
