<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Date')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-date" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[date]" type="text" value="{$row.date}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Register_num')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-register_num" class="form-control" name="row[register_num]" type="number" value="{$row.register_num|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Real_num')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-real_num" class="form-control" name="row[real_num]" type="number" value="{$row.real_num|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Buy_product_num')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-buy_product_num" class="form-control" name="row[buy_product_num]" type="number" value="{$row.buy_product_num|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Recharge_money')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-recharge_money" class="form-control" step="0.01" name="row[recharge_money]" type="number" value="{$row.recharge_money|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Buy_product_money')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-buy_product_money" class="form-control" step="0.01" name="row[buy_product_money]" type="number" value="{$row.buy_product_money|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Withdraw_money')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-withdraw_money" class="form-control" step="0.01" name="row[withdraw_money]" type="number" value="{$row.withdraw_money|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Recharge_num')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-recharge_num" class="form-control" name="row[recharge_num]" type="number" value="{$row.recharge_num|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Withdraw_num')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-withdraw_num" class="form-control" name="row[withdraw_num]" type="number" value="{$row.withdraw_num|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
