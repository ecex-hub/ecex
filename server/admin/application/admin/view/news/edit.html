<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text"
                   value="{$row.title|htmlentities}">
        </div>
    </div> 

    
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">新闻类型:</label>
        <input class="form-check-input" type="radio" name="row[type]" value="1"
               {if isset($row.type) && $row.type== 1} checked="checked" {/if}>

        <label class="form-check-label">
            内部新闻
        </label>
        <input class="form-check-input" type="radio" name="row[type]" value="2"
               {if isset($row.type) && $row.type== 2} checked="checked" {/if}>

        <label class="form-check-label">
            外部新闻
        </label>

        <input class="form-check-input" type="radio" name="row[type]" value="3"
               {if isset($row.type) && $row.type== 3} checked="checked" {/if}>

        <label class="form-check-label">
            纯图新闻
        </label>
    </div>

    <div class="form-group">
        <label for="c-local" class="control-label col-xs-12 col-sm-2">封面:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" name="row[coverUrl]" id="c-local" class="form-control"
                   value="{$row.coverUrl|htmlentities}"/>
            <ul class="row list-inline faupload-preview" id="p-local"></ul>
        </div>
    </div>
    <div class="form-group">
        <label for="c-local" class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="button" id="faupload-local" class="btn btn-primary faupload" data-input-id="c-local"
                    data-multiple="true" data-preview-id="p-local" data-url="{:url('ajax/upload')}"><i
                    class="fa fa-upload"></i> 上传图片
            </button>
        </div>
    </div>

    <div class="form-group" id="url-id">
        <label class="control-label col-xs-12 col-sm-2">跳转链接:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-url" data-rule="" class="form-control" name="row[url]" type="text" value="{$row.url|htmlentities|default=''}">
        </div>
    </div>


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Content')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-content" data-rule="required" class="form-control editor" rows="5" name="row[content]"
                      cols="50">{$row.content|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group" id="itime-id">
        <label class="control-label col-xs-12 col-sm-2">{:__('Itime')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-itime" data-rule="required" class="form-control datetimepicker"
                   data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[itime]" type="text"
                   value="{:$row.itime?datetime($row.itime):''}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        function toggleUrlField() {
            if ($("input[name='row[type]']:checked").val() == "1" || $("input[name='row[type]']:checked").val() == "3") {
                $("#url-id").hide();
            } else {
                // Show the URL input field when "外部新闻" is selected
                $("#url-id").show();
            }

            if ($("input[name='row[type]']:checked").val() == "2") {
            
                $("#itime-id").hide();

            } else {
                // Show the URL input field when "外部新闻" is selected
              
                $("#itime-id").show();

            }
        }

        // Initially check if the radio is set to "内部新闻", then hide the URL field
        toggleUrlField();

        // Listen for changes on the radio buttons
        $("input[name='row[type]']").change(function () {
            toggleUrlField();
        });


    });
</script>
