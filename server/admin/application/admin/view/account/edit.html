<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">类型</label>
        <input class="form-check-input" type="radio" name="row[money_type]" value="2" checked>
        <label class="form-check-label">
            回报钱包
        </label>
        <input class="form-check-input" type="radio" name="row[money_type]" value="1">
        <label class="form-check-label">
            充值余额
        </label>
        <input class="form-check-input" type="radio" name="row[money_type]" value="3">
        <label class="form-check-label">
            补助钱包
        </label>
        <input class="form-check-input" type="radio" name="row[money_type]" value="4">
        <label class="form-check-label">
            国众基金
        </label>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">类型</label>
        <input class="form-check-input" type="radio" name="row[type]" value="1" checked>
        <label class="form-check-label">
            上分
        </label>
        <input class="form-check-input" type="radio" name="row[type]" value="2">
        <label class="form-check-label">
            下分
        </label>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Money')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-buy_product_money" class="form-control" step="0.01" name="row[money]" type="number"
                   value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-content" data-rule="" class="form-control editor" rows="5" name="row[remark]"
                      cols="50"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
