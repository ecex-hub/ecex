<style>
  /* 统计卡片样式优化 */
  .stats-container {
    margin-bottom: 20px;
  }

  .info-box {
    display: block;
    min-height: 120px;
    background: #fff;
    width: 100%;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    border-radius: 4px;
    margin-bottom: 15px;
    border: 1px solid #e0e0e0;
    transition: all 0.3s ease;
  }

  .info-box:hover {
    transform: translateY(-2px);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
  }

  .info-box-icon {
    border-top-left-radius: 4px;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    border-bottom-left-radius: 4px;
    display: block;
    float: left;
    height: 116px;
    width: 120px;
    text-align: center;
    font-size: 45px;
    line-height: 120px;
    background: rgba(0, 0, 0, 0.2);
    color: #fff;
  }

  .info-box-content {
    padding: 5px 10px;
    margin-left: 120px;
  }

  .info-box-text {
    text-transform: uppercase;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    display: block;
  }

  .info-box-number {
    display: block;
    font-weight: bold;
    font-size: 24px;
    color: #ffffff;
    margin-top: 5px;
  }

  .info-box-subtext {
    display: block;
    font-size: 12px;
    color: #ffffff;
    margin-top: 3px;
  }

  .progress {
    background: rgba(0, 0, 0, 0.1);
    height: 4px;
    margin: 5px 0;
    border-radius: 2px;
  }

  .progress-bar {
    height: 4px;
    border-radius: 2px;
    background-color: #3c8dbc;
  }


  /* 不同颜色的主题*/
  .recharge-box {
    border-top-color: #00a65a !important;
    background: #00a65a !important;
  }


  .recharge-box .info-box-icon {
    background: #00a65a !important;
  }

  .bg-aqua-rechargenum {
    border-top-color: #00c0ef;
    background: #00c0ef;
  }

  .bg-aqua-rechargenum .info-box-icon {
    background: #00c0ef;
  }

  .bg-yellow {
    border-top-color: #f39c12;
  }

  .bg-yellow .info-box-icon {
    background: #f39c12;
  }

  .bg-purple {
    border-top-color: #605ca8;
  }

  .bg-purple .info-box-icon {
    background: #605ca8;
  }

  .bg-red {
    border-top-color: #dd4b39;
  }

  .bg-red .info-box-icon {
    background: #dd4b39;
  }

  .bg-teal {
    border-top-color: #39cccc;
  }

  .bg-teal .info-box-icon {
    background: #39cccc;
  }

  /* 响应式调整 */
  @media (max-width: 768px) {
    .info-box-icon {
      height: 90px;
      width: 90px;
      font-size: 35px;
      line-height: 90px;
    }

    .info-box-content {
      margin-left: 90px;
    }

    .info-box-number {
      font-size: 20px;
    }

    .info-box {
      min-height: 90px;
    }
  }
</style>

<div class="panel panel-default panel-intro">
  {:build_heading()}

  <div class="panel-body">
    <!-- 统计数据卡片区域 -->
    <div class="row stats-container">
      <!-- 总金额和今日金额 -->
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
        <div class="info-box recharge-box">
          <span class="info-box-icon"><i class="fa fa-money"></i></span>
          <div class="info-box-content">
            <span class="info-box-text">充值金额</span>
            <span class="info-box-number" id="total_money">¥0.00</span>

            <div class="progress">
              <div class="progress-bar" style="width: 100%"></div>
            </div>
            <span class="info-box-subtext">今日充值金额: <span id="today_money">¥0.00</span></span>
          </div>
        </div>
      </div>

      <!-- 充值人数和今日充值人数 -->
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
        <div class="info-box bg-aqua-rechargenum">
          <span class="info-box-icon"><i class="fa fa-users"></i></span>
          <div class="info-box-content">
            <span class="info-box-text">充值人数</span>
            <span class="info-box-number" id="total_users">0人</span>

            <div class="progress">
              <div class="progress-bar" style="width: 100%"></div>
            </div>
            <span class="info-box-subtext">今日充值人数: <span id="today_users">0人</span></span>
          </div>
        </div>
      </div>

      <!-- 完成金额和今日完成金额 -->
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12">
        <div class="info-box bg-yellow">
          <span class="info-box-icon"><i class="fa fa-check-circle"></i></span>
          <div class="info-box-content">
            <span class="info-box-text">总完成金额</span>
            <span class="info-box-number" id="completed_money">¥0.00</span>
            <div class="progress">
              <div class="progress-bar" style="width: 100%"></div>
            </div>
            <span class="info-box-subtext">今日完成金额: <span id="today_completed_money">¥0.00</span></span>
          </div>
        </div>
      </div>
    </div>

    <div id="myTabContent" class="tab-content">
      <div class="tab-pane fade active in" id="one">
        <div class="widget-body no-padding">
          <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i
                class="fa fa-refresh"></i> </a>
          </div>
          <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
            data-operate-edit="{:$auth->check('pay/edit')}" data-operate-del="{:$auth->check('pay/del')}" width="100%">
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // 页面加载完成后初始化统计数据
  $(document).ready(function () {
    // 如果需要初始化数据，可以在这里调用
    loadStatsData();
  });

  // 加载统计数据
  function loadStatsData () {
    // 这里可以通过AJAX获取实时数据
    // 示例数据更新
    updateStatsDisplay({
      total_money: '125,680.50',
      today_money: '2,340.80',
      total_users: '1,245',
      today_users: '32',
      completed_money: '125,680.50',
      today_completed_money: '2,340.80'
    });
  }

  // 更新统计数据展示
  function updateStatsDisplay (stats) {
    $('#total_money').text('¥' + stats.total_money);
    $('#today_money').text('¥' + stats.today_money);
    $('#total_users').text(stats.total_users + '人');
    $('#today_users').text(stats.today_users + '人');
    $('#completed_money').text('¥' + stats.completed_money);
    $('#today_completed_money').text('¥' + stats.today_completed_money);
  }
</script>
