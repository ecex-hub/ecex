version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_USERNAME}/${GITHUB_REPO}/backend:latest
    container_name: ecex-backend
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - ./backend/runtime:/var/www/html/backend/runtime
      - ./backend/web/assets:/var/www/html/backend/web/assets
    networks:
      - ecex-network
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: ecex-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-stock}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ecex-network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: ecex-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - ecex-network

networks:
  ecex-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

