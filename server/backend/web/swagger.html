<!DOCTYPE html>
<html>
<head>
    <title>Swagger UI</title>
    <link rel="stylesheet" href="/swagger-ui-5.18.2/dist/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="/swagger-ui-5.18.2/dist/swagger-ui-bundle.js"></script>
<script src="/swagger-ui-5.18.2/dist/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = function () {
        const ui = SwaggerUIBundle({
            url: "/api-docs.json", // 指向你的OpenAPI JSON文件路径
            dom_id: '#swagger-ui',
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "BaseLayout"
        });
        window.ui = ui;
    };
</script>
</body>
</html>
