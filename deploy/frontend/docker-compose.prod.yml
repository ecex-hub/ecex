version: '3.8'

services:
  # 前端应用（从 GitHub 拉取镜像）
  frontend:
    image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/frontend:latest
    container_name: vue-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy-data:/data
      - ./caddy-config:/config
      - ./logs:/var/log/caddy
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge

