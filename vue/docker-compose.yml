version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecex-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ecex-network

volumes:
  caddy_data:
  caddy_config:

networks:
  ecex-network:
    driver: bridge

